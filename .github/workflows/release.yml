name: Release

# Manual trigger only — run from the Actions tab.
# Pick how to bump the version; it's computed from the current module.json.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version increment"
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          CURRENT=$(jq -r '.version' module.json)
          CURRENT="${CURRENT#v}"
          if [ -z "$CURRENT" ] || [ "$CURRENT" = "null" ]; then
            echo "Could not read the current version from module.json." >&2
            exit 1
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          MAJOR=${MAJOR:-0}; MINOR=${MINOR:-0}; PATCH=${PATCH:-0}
          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
            *) echo "Unknown bump type: $BUMP" >&2; exit 1 ;;
          esac
          VERSION="$MAJOR.$MINOR.$PATCH"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Bumping $CURRENT -> $VERSION ($BUMP)"

      - name: Update module.json
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REPO_URL: https://github.com/${{ github.repository }}
        run: |
          jq \
            --arg version "$VERSION" \
            --arg url "$REPO_URL" \
            --arg manifest "$REPO_URL/releases/latest/download/module.json" \
            --arg download "$REPO_URL/releases/download/v$VERSION/module.zip" \
            '.version = $version | .url = $url | .manifest = $manifest | .download = $download' \
            module.json > module.json.tmp
          mv module.json.tmp module.json
          echo "Updated module.json:"
          cat module.json

      - name: Commit version bump
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add module.json
          git commit -m "chore: release v$VERSION"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Build module.zip
        run: |
          zip -r module.zip \
            module.json \
            scripts \
            styles \
            templates \
            languages \
            LICENSE \
            README.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            module.json
            module.zip
